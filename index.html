<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- Google tag (gtag.js): Google Analytics 4, só depois do aceite no aviso de cookies (LGPD).
         As trocas de rota da SPA são contadas pela medição otimizada do GA4 (eventos de histórico).
         O aviso e o carregamento após o aceite ficam em src/utils/consent.js -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('consent', 'default', {
        analytics_storage: 'denied',
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied'
      });

      window.lamitLoadAnalytics = function () {
        gtag('consent', 'update', { analytics_storage: 'granted' });
        if (document.getElementById('gtag-js')) return;
        var script = document.createElement('script');
        script.id = 'gtag-js';
        script.async = true;
        script.src = 'https://www.googletagmanager.com/gtag/js?id=G-D4GEP4LFHS';
        document.head.appendChild(script);
      };

      // Aceite de uma visita anterior: libera antes do config, para a primeira página já contar
      try {
        if (localStorage.getItem('lamit-cookies') === 'accepted') window.lamitLoadAnalytics();
      } catch (e) {}

      gtag('js', new Date());
      gtag('config', 'G-D4GEP4LFHS');
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A LAMIT é a Liga Acadêmica de Maratonas, Inovação e Tecnologia da UCSal: hackathons, eventos e comunidade de tecnologia em Salvador." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="shortcut icon" type="image/png" href="/media/brand/favicon1.png" />
    <title>LAMIT - Liga Acadêmica de Maratonas, Inovação e Tecnologia</title>
    <link rel="canonical" href="https://lamitsite.com.br/" />

         própria versão no build: scripts/og-pages.mjs -->

    <meta property="og:description" content="A LAMIT é a Liga Acadêmica de Maratonas, Inovação e Tecnologia da UCSal: hackathons, eventos e comunidade de tecnologia em Salvador." />

    <meta name="twitter:image" content="https://lamitsite.com.br/og/home.jpg" />
    <script>
      (function () {
        var theme = 'dark'
        try {
          var saved = localStorage.getItem('lamit-theme')
          theme = saved === 'light' || saved === 'dark' ? saved
            : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
        } catch (e) {}
        document.documentElement.dataset.theme = theme
      })()
    </script>
