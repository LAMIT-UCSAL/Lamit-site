         própria versão no build: scripts/og-pages.mjs -->

    <meta property="og:site_name" content="LAMIT" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="LAMIT - Liga Acadêmica de Maratonas, Inovação e Tecnologia" />
    <meta property="og:description" content="A LAMIT é a Liga Acadêmica de Maratonas, Inovação e Tecnologia da UCSal: hackathons, eventos e comunidade de tecnologia em Salvador." />

    <meta property="og:url" content="https://lamit-site.monjogui.workers.dev/" />

    <meta name="twitter:title" content="LAMIT - Liga Acadêmica de Maratonas, Inovação e Tecnologia" />

    <meta name="twitter:image" content="https://lamit-site.monjogui.workers.dev/og/home.jpg" />
    <script>
      (function () {
        var theme = 'dark'
        try {
          var saved = localStorage.getItem('lamit-theme')
          theme = saved === 'light' || saved === 'dark' ? saved
            : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
        } catch (e) {}
        document.documentElement.dataset.theme = theme
      })()
    </script>
